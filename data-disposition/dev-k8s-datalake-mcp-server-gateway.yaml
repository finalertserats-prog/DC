apiVersion: apps/v1
kind: Deployment
metadata:
  name: datalake-mcp-server-gateway
  namespace: datalake
spec:
  replicas: 1
  selector:
    matchLabels:
      name: datalake-mcp-server-gateway
  template:
    metadata:
      labels:
        name: datalake-mcp-server-gateway
    spec:
      automountServiceAccountToken: false      
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001          
      containers:
      - image: tsdevopsteam/platform:datalake-mcp-server-gateway-$BUILD_NUMBER
        name: datalake-mcp-server-gateway      
        envFrom:
        - configMapRef:
            name: datalake-mcp-server-gateway-env
        - secretRef:
            name: datalake-mcp-server-gateway-secret
        ports:
        - containerPort: 5000
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi         	
      imagePullSecrets:
      - name: ts-platform
---

apiVersion: v1
kind: Service
metadata:
  name: datalake-mcp-server-gateway
  namespace: datalake
spec:
  type: ClusterIP
  ports: 
  - port: 5000
  selector:
    name: datalake-mcp-server-gateway
